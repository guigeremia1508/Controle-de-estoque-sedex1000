<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar saida</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Registrar saida</h1>

    <p><a href="home.html">Voltar</a></p>

    <label for="codigoSaida">Codigo ou nome do produto</label>
    <br>
    <input id="codigoSaida" type="text" onblur="buscarProdutoSaida()">
    <br><br>

    <button onclick="buscarProdutoSaida()">Buscar produto</button>
    <br>
    <p id="nomeSaida"></p>

    <label for="unidadeSaida">Tipo de unidade</label>
    <br>
    <input id="unidadeSaida" type="text" readonly>
    <br><br>

    <label for="quantidadeSaida">Quantidade</label>
    <br>
    <input id="quantidadeSaida" type="number" min="0.01" step="any">
    <br><br>

    <label for="dataSaidaRegistro">Data da saida</label>
    <br>
    <input id="dataSaidaRegistro" type="date">
    <br><br>

    <button onclick="registrarSaida()">Registrar saida</button>
    <br>

    <p id="mensagemSaida"></p>

    <script src="script.js"></script>
</body>
</html>
