<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar produto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Editar produto</h1>

    <p><a href="home.html">Voltar</a></p>

    <label for="buscarEdicao">Codigo ou nome do produto</label>
    <br>
    <input id="buscarEdicao" type="text">
    <br><br>

    <button onclick="buscarProdutoEdicao()">Buscar produto</button>
    <br>

    <p id="mensagemEdicao"></p>

    <div id="formEdicao" hidden>
        <p>Codigo do produto: <span id="editarCodigoOriginalTexto"></span></p>
        <input id="editarCodigoOriginal" type="hidden">

        <label for="editarDescricao">Nome ou descricao</label>
        <br>
        <input id="editarDescricao" type="text">
        <br><br>

        <label for="editarUnidade">Tipo de unidade</label>
        <br>
        <select id="editarUnidade">
            <option value="">Selecione</option>
            <option value="unidade">Unidade</option>
            <option value="kg">Kg</option>
            <option value="g">G</option>
            <option value="tonelada">Tonelada</option>
            <option value="litro">Litro</option>
            <option value="ml">Ml</option>
            <option value="metro">Metro</option>
            <option value="caixa">Caixa</option>
            <option value="pacote">Pacote</option>
            <option value="outro">Outro</option>
        </select>
        <br><br>

        <label for="editarQuantidade">Quantidade no estoque</label>
        <br>
        <input id="editarQuantidade" type="number" min="0" step="any">
        <br><br>

        <label for="editarCategoria">Categoria</label>
        <br>
        <input id="editarCategoria" type="text">
        <br><br>

        <button onclick="salvarEdicao()">Salvar alteracoes</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
