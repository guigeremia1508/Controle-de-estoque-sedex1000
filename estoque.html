<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar estoque</title>
    <link rel="stylesheet" href="style.css">
</head>
<body onload="mostrarEstoque()">

    <h1>Consultar estoque</h1>

    <p><a href="home.html">Voltar</a></p>

    <label for="pesquisaEstoque">Pesquisar produto</label>
    <br>
    <input id="pesquisaEstoque" type="text" placeholder="Nome ou codigo">
    <br><br>
    <button onclick="pesquisarEstoque()">Pesquisar</button>
    <br><br>

    <h2>Produtos no estoque</h2>
    <table border="1">
        <thead>
            <tr>
                <th>Cod. produto</th>
                <th>Descricao</th>
                <th>Quantidade</th>
                <th>Unidade</th>
                <th>Categoria</th>
                <th>Data entrada</th>
                <th>Data saida</th>
            </tr>
        </thead>
        <tbody id="listaEstoque"></tbody>
    </table>

    <h2>Produtos que saíram</h2>
    <table border="1">
        <thead>
            <tr>
                <th>Cod. produto</th>
                <th>Descricao</th>
                <th>Quantidade atual</th>
                <th>Unidade</th>
                <th>Data saida</th>
            </tr>
        </thead>
        <tbody id="listaSaidas"></tbody>
    </table>

    <script src="script.js"></script>
</body>
</html>
