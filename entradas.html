<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar produto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Cadastrar produto</h1>

    <p><a href="home.html">Voltar</a></p>

    <label for="codigo">Codigo do produto</label>
    <br>
    <input id="codigo" type="text">
    <br><br>

    <label for="descricao">Descricao</label>
    <br>
    <input id="descricao" type="text">
    <br><br>

    <label for="unidade">Unidade de medida</label>
    <br>
    <select id="unidade">
        <option value="">Selecione</option>
        <option value="unidade">Unidade</option>
        <option value="kg">Kg</option>
        <option value="g">G</option>
        <option value="tonelada">Tonelada</option>
        <option value="litro">Litro</option>
        <option value="ml">Ml</option>
        <option value="metro">Metro</option>
        <option value="caixa">Caixa</option>
        <option value="pacote">Pacote</option>
        <option value="outro">Outro</option>
    </select>
    <br><br>

    <label for="quantidade">Quantidade</label>
    <br>
    <input id="quantidade" type="number" min="0.01" step="any">
    <br><br>

    <label for="categoria">Categoria</label>
    <br>
    <input id="categoria" type="text">
    <br><br>

    <label for="dataEntrada">Data da entrada</label>
    <br>
    <input id="dataEntrada" type="date">
    <br><br>

    <button onclick="cadastrarEntrada()">Cadastrar</button>
    <br>

    <p id="mensagem"></p>

    <script src="script.js"></script>
</body>
</html>
